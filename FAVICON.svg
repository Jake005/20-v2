<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Gradient fundal de la indigo închis la roz/violet -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0920" />
      <stop offset="100%" stop-color="#2a1236" />
    </linearGradient>

    <!-- Gradient strălucire inima -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f28bb4" />
      <stop offset="100%" stop-color="#a865cb" />
    </linearGradient>

    <!-- Umbră neon/glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundal rotund cu colțuri suave (squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(242, 139, 180, 0.3)" stroke-width="1.5"/>

  <!-- Inimă centrală stilizată -->
  <path d="M32 48 C20 38 14 29 14 21 A9.5 9.5 0 0 1 30.5 14.5 L32 16.5 L33.5 14.5 A9.5 9.5 0 0 1 50 21 C50 29 44 38 32 48 Z" 
        fill="url(#heartGrad)" 
        filter="url(#glow)" />

  <!-- Steluță mică cosmică / strălucire sus în dreapta -->
  <path d="M46 12 L47.2 15.8 L51 17 L47.2 18.2 L46 22 L44.8 18.2 L41 17 L44.8 15.8 Z" fill="#ffffff" opacity="0.95" />
</svg>
